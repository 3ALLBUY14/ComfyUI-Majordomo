  <radialGradient id="blue-glow"><stop stop-color="#397ac2" stop-opacity=".2"/><stop offset="1" stop-color="#397ac2" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#9cbadd" opacity=".13"/></pattern>
  <clipPath id="bounds"><rect x=".5" y=".5" width="1199" height="443" rx="20"/></clipPath>
</defs>
