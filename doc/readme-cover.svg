<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-labelledby="title desc">
<title id="title">ComfyUI-Majordomo · 让工作流，一目了然</title>
<desc id="desc">节点整理工具封面。右侧以模型、提示词、采样和解码节点示意对齐、排列、配色与分组，实际操作见文档演示。提供 14 种整理工具、14 套调色板、中英双语和快速分组。</desc>
<defs>
