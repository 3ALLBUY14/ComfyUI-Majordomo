[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-majordomo"
version = "1.0.0"
description = "A tool that organizes workflow nodes into clean, user-friendly layouts"
authors = [
  {name = "ALL BUYBUY", email = "60284675+3ALLBUY14@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "MIT license"}
requires-python = ">=3.10"
classifiers = []
dependencies = [

]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/3ALLBUY14/ComfyUI-Majordomo"
BugTracker = "https://github.com/3ALLBUY14/ComfyUI-Majordomo/issues"
Documentation = "https://github.com/3ALLBUY14/ComfyUI-Majordomo/wiki"


[tool.comfy]
PublisherId = "3ALLBUY14"
DisplayName = "Node Alignment Panel"
Icon = "https://raw.githubusercontent.com/3ALLBUY14/ComfyUI-Majordomo/main/icons/collapse.svg"
Tags = ["alignment", "layout", "organization", "palette", "snap", "groups", "nodes"]
Repository = "https://github.com/3ALLBUY14/ComfyUI-Majordomo"
includes = ["js"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
target-version = "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
